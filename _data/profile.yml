short_bio_text_justify: false
short_bio: >-
  <p>
    I am Minmao Wang (王慜懋), currently pursuing a Master's degree in Data Science and Business Analytics at 
    <a href="https://www.fudan.edu.cn/" target="_blank">Fudan University</a>. 
    I received my Bachelor's degree in Information Management and Information Systems from 
    <a href="http://www.tju.edu.cn/" target="_blank">Tianjin University</a>, 
    where I graduated first in my major with a GPA of 3.94/4.0.
  </p>
  <p>
    During my undergraduate studies, I was fortunate to be advised by 
    <a href="https://www.adm-cube.online/people/teacher/hongke_zhao" target="_blank">Prof. Hongke Zhao</a> and 
    <a href="https://www.adm-cube.online/people/teacher/likang_wu" target="_blank">Prof. Likang Wu</a> at Tianjin University.
    I also had the privilege of working with 
    <a href="https://qingpengcai.github.io/" target="_blank">Dr. Qingpeng Cai</a> 
    during my internship at Kuaishou Technology.
  </p>
  <p>
    My research focuses on applying advanced deep learning methods, including reinforcement learning and large language models, to address real-world problems in recommender systems. I am particularly interested in how practical modeling ideas can be transformed into effective algorithms that improve user experience and system performance.
  </p>
  <p>
  Looking ahead, I hope to continue exploring interesting and impactful problems while building systems that connect intelligent decision-making with meaningful real-world applications.
  </p>
